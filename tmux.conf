# ==============================================================================
# GENERAL SETTINGS
# ==============================================================================

# Fix colors for modern terminals (Neovim support)
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Enable mouse support (clickable windows, panes, resizable)
set -g mouse on

# Increase history limit (buffer size)
set-option -g history-limit 50000

# Start numbering windows and panes at 1 (not 0) for easier reach
set-option -g base-index 1
set-option -g pane-base-index 1

# Renumber windows automatically when one is closed
set-option -g renumber-windows on

# Remove delay when pressing ESC (fixes slow mode switching in Neovim)
set-option -s escape-time 0

# Enable focus events (needed for some Vim plugins)
set-option -s focus-events on

# Fix terminal title
set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"


# ==============================================================================
# KEY BINDINGS
# ==============================================================================

# Change Prefix from Ctrl-b to Alt-a (M-a)
set-option -g prefix M-a
unbind C-b
bind M-a send-prefix

# Reload config file easily (optional but recommended)
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# Open new panes in the CURRENT directory
bind c new-window -c "#{pane_current_path}"
bind ";" split-window -h -c "#{pane_current_path}"
bind "'" split-window -v -c "#{pane_current_path}"

# German keyboard support (renumber window)
bind "`" move-window -r

# Pane Navigation (Vim style: h, j, k, l)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r Tab select-pane -t :.+

# Pane Resizing (Hold prefix + Capital H/J/K/L)
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Popup / Session Management
bind -n C-n display-popup -E 'bash -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind -n C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
# bind -n F3 popup -xC -yC -w80% -h80% -E -d "#{pane_current_path}" -T " TERMINAL " "$SHELL"
# list popup_socket session: tmux -L popup_socket ls, kill session:tmux -L popup_socket kill-server
bind -n F2 run-shell 'tmux -L popup_socket new-session -d -s popup; tmux display-popup -d "#{pane_current_path}" -w 80% -h 80% -T " TERMINAL " -EE "tmux -L popup_socket attach-session -t popup \; bind-key -n F2 detach-client"'

# ==============================================================================
# COPY MODE & CLIPBOARD (WAYLAND)
# ==============================================================================

# Use Vim keys in copy mode
set -g mode-keys vi

# Visual selection bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# WAYLAND FIX: Pipe selection to wl-copy automatically on mouse drag end
set -s copy-command 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"


# ==============================================================================
# VISUAL STYLING (THEME)
# ==============================================================================

# Define Colors
RED="#e06c75"
GREEN="#98c379"
YELLOW="#e5c07b"
BLUE="#61afef"
MAGENTA="#c678dd"
CYAN="#56b6c2"
BLACK="#282c34"
DARK_GRAY="#3e4451"
FG="#abb2bf"

# Status Bar Position
set-option -g status-position top
set-option -g status-style bg=${BLACK},fg=${FG}
set-option -g status-justify left

# Left Status: Hostname and Session Name
set-option -g status-left-length 100
set-option -g status-left ""

# Right Status: Time and Battery
set-option -g status-right-length 100
set-option -g status-right "\
#[bg=${BLACK},fg=${YELLOW}] #S <\
#[bg=${BLACK},fg=${YELLOW}] %I:%M %p <\
#[bg=${BLACK},fg=${GREEN}] #(cat /sys/class/power_supply/BAT0/capacity)%\
"

# Window List Styling
set-option -g window-status-separator ""
set-option -g window-status-format " #W "
set-option -g window-status-current-format "#[bg=${BLACK},fg=${GREEN}][#W]"


# ==============================================================================
# PLUGINS & SCRIPTS
# ==============================================================================

# Restore sessions (Resurrect / Continuum)
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux 

# Save environment every 1 minute
set -g @continuum-save-interval "5"
